[package]
name = "authkit"
version = "0.2.0"
edition = "2021"
description = "AuthKit: canonical Rust auth boundary — PKCE, TOTP, WebAuthn, OIDC, User mgmt, Sessions, RBAC."
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/AuthKit"
rust-version = "1.75"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
axum = "0.7"
tower = "0.5"
tokio = { version = "1.0", features = ["full"] }
subtle = "2.6"
percent-encoding = "2.3"
tracing = "0.1"
base64 = "0.22"
base32 = "0.5"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }
getrandom = "0.2"
url = "2.5"
pbkdf2 = "0.12"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
